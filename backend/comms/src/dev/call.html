<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>comms dev · simulated call</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
      textarea { width: 100%; height: 5rem; font: 12px ui-monospace, monospace; box-sizing: border-box; }
      pre { background: #f4f4f4; padding: 0.75rem; overflow-x: auto; white-space: pre-wrap; }
      button { margin-right: 0.5rem; padding: 0.4rem 0.9rem; }
      .phone { border: 1px solid #ccc; border-radius: 12px; padding: 1rem; margin: 1rem 0; }
      #status { font-weight: 600; }
      .agent { color: #a00; }
      .user { color: #036; }
      .system, .error { color: #777; font-style: italic; }
    </style>
  </head>
  <body>
    <h1>Simulated call (dev only)</h1>
    <p>
      Test harness for the ElevenLabs call flow: ring → accept → talk → hang up → analysis.
      Victor's real UI replaces this; the contract is in <code>backend/comms/README.md</code>.
    </p>

    <label for="body">Request body for <code>POST /comms/calls</code></label>
    <textarea id="body"></textarea>
    <p><button id="ring">Ring the phone</button></p>

    <div class="phone" id="phone" hidden>
      <div id="status"></div>
      <p>
        <button id="accept">Accept</button>
        <button id="decline">Decline</button>
        <button id="hangup" hidden>Hang up</button>
      </p>
      <div id="log"></div>
    </div>

    <h3>Result (<code>GET /comms/calls/:id</code>)</h3>
    <pre id="result">–</pre>

    <script type="module">
      import { Conversation } from 'https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.26.0/+esm';

      const $ = (id) => document.getElementById(id);
      const api = async (method, path, body) => {
        const res = await fetch(`/comms${path}`, {
          method,
          headers: body ? { 'content-type': 'application/json' } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(`${res.status} ${JSON.stringify(json)}`);
        return json;
      };
      const setStatus = (s) => ($('status').textContent = s);
      const showResult = (call) => ($('result').textContent = JSON.stringify(call, null, 2));
      const log = (role, text) => {
        const line = document.createElement('div');
        line.className = role;
        line.textContent = `${role}: ${text}`;
        $('log').append(line);
      };

      let callId = null;
      let conversation = null;
      let endedReported = false;

      // Scenarios are server-owned: pick one by id (see GET /comms/scenarios?channel=call), or {} for a random one.
      $('body').value = JSON.stringify({ scenarioId: 'bank-fraud-dept-otp-1' }, null, 2);

      $('ring').onclick = async () => {
        try {
          const res = await api('POST', '/calls', JSON.parse($('body').value));
          callId = res.callId;
          conversation = null;
          endedReported = false;
          $('log').replaceChildren();
          $('phone').hidden = false;
          $('accept').hidden = $('decline').hidden = false;
          $('hangup').hidden = true;
          setStatus(`📞 Incoming call: ${res.callerLabel}`);
          showResult(res.call);
        } catch (e) {
          setStatus(`Error: ${e.message}`);
        }
      };

      $('decline').onclick = async () => {
        $('accept').hidden = $('decline').hidden = true;
        showResult(await api('POST', `/calls/${callId}/decline`, { reason: 'declined' }));
        setStatus('Declined');
      };

      $('accept').onclick = async () => {
        $('accept').hidden = $('decline').hidden = true;
        setStatus('Connecting…');
        try {
          // Ask for the mic up front so a denial shows a clear error.
          (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach((t) => t.stop());
          const { conversationToken, overrides } = await api('POST', `/calls/${callId}/accept`);
          conversation = await Conversation.startSession({
            conversationToken,
            connectionType: 'webrtc',
            overrides,
            onConnect: ({ conversationId }) => {
              setStatus(`In call (${conversationId})`);
              $('hangup').hidden = false;
              api('POST', `/calls/${callId}/connected`, { conversationId }).catch((e) => log('error', e.message));
            },
            onMessage: ({ role, message }) => log(role, message),
            onModeChange: ({ mode }) => setStatus(`In call · agent ${mode}`),
            onError: (message) => log('error', message),
            onDisconnect: (details) => {
              log('system', `disconnected (${details.reason})`);
              reportEnded();
            },
          });
        } catch (e) {
          setStatus(`Error: ${e.message}`);
        }
      };

      $('hangup').onclick = () => conversation?.endSession();

      async function reportEnded() {
        if (endedReported || !callId) return;
        endedReported = true;
        $('hangup').hidden = true;
        setStatus('Call ended · analyzing…');
        try {
          await api('POST', `/calls/${callId}/ended`, { conversationId: conversation?.getId() });
          for (;;) {
            const call = await api('GET', `/calls/${callId}`);
            showResult(call);
            if (call.status === 'completed') return setStatus(`Completed · outcome: ${call.outcome}`);
            await new Promise((r) => setTimeout(r, 2000));
          }
        } catch (e) {
          setStatus(`Error: ${e.message}`);
        }
      }
    </script>
  </body>
</html>
